<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Ngaji Generus</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS CDN (Full Version dengan Style Support) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            body { background-color: white !important; padding: 0 !important; }
            .card-container { box-shadow: none !important; max-width: 100% !important; padding: 0 !important; border: none !important; }
            input, select, textarea { border: none !important; background: transparent !important; }
        }
    </style>
</head>
<body class="bg-slate-100/80 min-h-screen p-2 sm:p-4 md:p-8 font-sans antialiased text-slate-800">

    <div class="card-container max-w-4xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-200/80 overflow-hidden">
        
        <!-- HEADER APLIKASI -->
        <div class="bg-gradient-to-r from-emerald-800 via-emerald-700 to-teal-800 p-5 sm:p-6 text-white relative">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-white/10 backdrop-blur-md text-emerald-100 border border-white/20" id="statusAdminText">🔒 Mode Pengurus</span>
                    <span class="text-xs font-medium px-2.5 py-0.5 rounded-full text-emerald-200 bg-emerald-950/40 border border-emerald-500/30 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Sync
                    </span>
                </div>
                
                <button onclick="toggleAdminMode()" id="btnToggleAdmin" class="no-print bg-white/10 hover:bg-white/20 text-white text-xs font-medium px-3.5 py-1.5 rounded-lg transition border border-white/20 backdrop-blur-md flex items-center gap-1.5 shadow-sm">
                    🔑 Masuk Mode Admin
                </button>
            </div>

            <div class="text-center space-y-1">
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Absensi Ngaji Generus</h1>
                <p class="text-emerald-100/80 text-xs sm:text-sm font-light">Pencatatan Kehadiran & Jurnal Pengajian Realtime</p>
            </div>
        </div>

        <div class="p-4 sm:p-6 space-y-6">

            <!-- PANEL TANGGAL, FILTER, & JURNAL MATERI -->
            <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-4 shadow-sm space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-2.5">
                        <label for="inputTanggal" class="text-xs font-bold text-slate-600 uppercase tracking-wider">📅 Tanggal:</label>
                        <input type="date" id="inputTanggal" onchange="gantiTanggal()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-700 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                    </div>

                    <!-- Filter Kategori -->
                    <div class="no-print flex items-center gap-2">
                        <label for="filterKategori" class="text-xs font-bold text-slate-600 uppercase tracking-wider">🔍 Filter:</label>
                        <select id="filterKategori" onchange="tampilkanGenerus()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-700 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                            <option value="Semua">Semua Kategori</option>
                            <option value="ACR">ACR (6-12 thn)</option>
                            <option value="APR">APR (13-15 thn)</option>
                            <option value="AR">AR (16-18 thn)</option>
                            <option value="AR Intensif">AR Intensif</option>
                            <option value="GPN-A">GPN-A (19-22 thn)</option>
                            <option value="GPN-B">GPN-B (23-30+ thn)</option>
                        </select>
                    </div>
                </div>

                <!-- Jurnal Materi Ngaji -->
                <div class="flex flex-col sm:flex-row sm:items-center gap-2 pt-3 border-t border-slate-200">
                    <label for="inputMateri" class="text-xs font-bold text-slate-600 uppercase tracking-wider whitespace-nowrap">📖 Materi Ngaji:</label>
                    <input type="text" id="inputMateri" onchange="simpanMateriCloud()" placeholder="Contoh: Surat Al-Baqarah 1-10 / Jilid 2 Hal 12..." class="flex-1 border border-slate-300 rounded-lg px-3.5 py-1.5 text-sm bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
                </div>
            </div>

            <!-- PANEL ADMIN -->
            <div id="areaAdminFitur" class="hidden no-print bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200/80 rounded-xl p-4 shadow-sm space-y-4">
                <div class="flex flex-wrap justify-between items-center gap-2 border-b border-amber-200/60 pb-2.5">
                    <div class="text-xs font-bold text-amber-900 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-amber-500"></span> MENU KELOLA DATA ADMIN
                    </div>
                    
                    <div class="flex flex-wrap items-center gap-2">
                        <button onclick="downloadRekapMultiSheetExcel()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-sm flex items-center gap-1">
                            📊 Download Rekap Bulanan (3 Sheet Excel)
                        </button>

                        <button onclick="resetAbsensiHariIni()" class="bg-white hover:bg-amber-100 text-amber-800 text-xs font-semibold px-3 py-1.5 rounded-lg transition border border-amber-300 shadow-sm flex items-center gap-1">
                            🔄 Reset Status Absen Hari Ini
                        </button>

                        <button onclick="resetSemuaData()" class="bg-white hover:bg-red-50 text-red-700 text-xs font-semibold px-3 py-1.5 rounded-lg transition border border-red-200 shadow-sm flex items-center gap-1">
                            🗑️ Reset Database
                        </button>

                        <label class="cursor-pointer bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-sm flex items-center gap-1">
                            📂 Import CSV / Excel
                            <input type="file" id="fileCsvInput" accept=".csv" onchange="importCSV(event)" class="hidden">
                        </label>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="inputNama" placeholder="Nama lengkap generus baru..." class="flex-1 border border-amber-200 rounded-lg px-3.5 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <select id="inputKategori" class="border border-amber-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <option value="ACR">ACR (6-12 thn)</option>
                        <option value="APR">APR (13-15 thn)</option>
                        <option value="AR">AR (16-18 thn)</option>
                        <option value="AR Intensif">AR Intensif</option>
                        <option value="GPN-A">GPN-A (19-22 thn)</option>
                        <option value="GPN-B">GPN-B (23-30+ thn)</option>
                    </select>
                    <button onclick="tambahGenerus()" class="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2 rounded-lg text-sm font-semibold transition shadow-sm">
                        + Tambah
                    </button>
                </div>
            </div>

            <!-- KARTU REKAP RINGKASAN KEHADIRAN -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div class="bg-gradient-to-br from-emerald-50 to-emerald-100/50 border border-emerald-200/80 rounded-xl p-3.5 text-center shadow-sm">
                    <div class="text-xs font-bold text-emerald-700 uppercase tracking-wider">Hadir</div>
                    <div id="jumlahHadir" class="text-2xl font-extrabold text-emerald-800 mt-0.5">0</div>
                </div>
                <div class="bg-gradient-to-br from-amber-50 to-amber-100/50 border border-amber-200/80 rounded-xl p-3.5 text-center shadow-sm">
                    <div class="text-xs font-bold text-amber-700 uppercase tracking-wider">Izin</div>
                    <div id="jumlahIzin" class="text-2xl font-extrabold text-amber-800 mt-0.5">0</div>
                </div>
                <div class="bg-gradient-to-br from-blue-50 to-blue-100/50 border border-blue-200/80 rounded-xl p-3.5 text-center shadow-sm">
                    <div class="text-xs font-bold text-blue-700 uppercase tracking-wider">Sakit</div>
                    <div id="jumlahSakit" class="text-2xl font-extrabold text-blue-800 mt-0.5">0</div>
                </div>
                <div class="bg-gradient-to-br from-red-50 to-red-100/50 border border-red-200/80 rounded-xl p-3.5 text-center shadow-sm">
                    <div class="text-xs font-bold text-red-700 uppercase tracking-wider">Alpa</div>
                    <div id="jumlahAlpa" class="text-2xl font-extrabold text-red-800 mt-0.5">0</div>
                </div>
            </div>

            <!-- TABEL DAFTAR GENERUS -->
            <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-100/80 border-b border-slate-200 text-slate-700 font-semibold text-xs uppercase tracking-wider">
                                <th class="p-3.5 text-center w-12">No</th>
                                <th class="p-3.5">Nama & Kategori</th>
                                <th class="p-3.5 text-center">Status & Waktu</th>
                                <th class="p-3.5">Catatan / Alasan</th>
                            </tr>
                        </thead>
                        <tbody id="tabelGenerus" class="divide-y divide-slate-100 bg-white">
                            <!-- Data dimasukkan via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TOMBOL AKSI -->
            <div class="no-print pt-2">
                <div class="flex flex-col sm:flex-row gap-3">
                    <button onclick="cetakLaporan()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-2 shadow-sm">
                        🖨️ Cetak / Simpan PDF
                    </button>
                    <button onclick="exportExcelHarian()" class="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-2 shadow-sm">
                        📊 Export Excel Harian (.csv)
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- FIREBASE SDK MODULAR -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZLPT-hDqspOX4HIauNlw4ZpoMwR3zwls",
            authDomain: "absensi-generus-db.firebaseapp.com",
            projectId: "absensi-generus-db",
            storageBucket: "absensi-generus-db.firebasestorage.app",
            messagingSenderId: "350847945290",
            appId: "1:350847945290:web:c9737eebb3e8092db4f4b3",
            databaseURL: "https://absensi-generus-db-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.daftarGenerus = [];
        window.tanggalAktif = "";
        window.isAdmin = false;
        const PIN_ADMIN = "1234";

        // 1. Toggle Mode Admin
        window.toggleAdminMode = function() {
            if (!window.isAdmin) {
                const inputPIN = prompt("🔐 Masukkan PIN Admin:");
                if (inputPIN === PIN_ADMIN) {
                    window.isAdmin = true;
                    alert("Akses Admin Berhasil Diberikan! 🔑");
                    updateTampilanAdmin();
                } else if (inputPIN !== null) {
                    alert("❌ PIN Salah!");
                }
            } else {
                window.isAdmin = false;
                alert("Keluar dari Mode Admin.");
                updateTampilanAdmin();
            }
        };

        function updateTampilanAdmin() {
            const areaAdmin = document.getElementById("areaAdminFitur");
            const btnToggle = document.getElementById("btnToggleAdmin");
            const statusText = document.getElementById("statusAdminText");

            if (window.isAdmin) {
                areaAdmin.classList.remove("hidden");
                btnToggle.innerText = "🔒 Keluar Admin";
                btnToggle.className = "no-print bg-red-500/80 hover:bg-red-600 text-white text-xs font-semibold px-3.5 py-1.5 rounded-lg transition border border-red-300 shadow-sm flex items-center gap-1.5";
                statusText.innerText = "🔓 Mode Admin Aktif";
                statusText.className = "text-xs font-semibold px-3 py-1 rounded-full bg-amber-400 text-amber-950 border border-amber-300 shadow-sm";
            } else {
                areaAdmin.classList.add("hidden");
                btnToggle.innerText = "🔑 Masuk Mode Admin";
                btnToggle.className = "no-print bg-white/10 hover:bg-white/20 text-white text-xs font-medium px-3.5 py-1.5 rounded-lg transition border border-white/20 backdrop-blur-md flex items-center gap-1.5 shadow-sm";
                statusText.innerText = "🔒 Mode Pengurus";
                statusText.className = "text-xs font-semibold px-3 py-1 rounded-full bg-white/10 backdrop-blur-md text-emerald-100 border border-white/20";
            }
            window.tampilkanGenerus();
        }

        // 2. Inisialisasi Tanggal
        function initTanggal() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("inputTanggal").value = today;
            window.tanggalAktif = today;
            listenDataCloud(window.tanggalAktif);
        }

        window.gantiTanggal = function() {
            window.tanggalAktif = document.getElementById("inputTanggal").value;
            listenDataCloud(window.tanggalAktif);
        };

        // 3. Listener Data Cloud
        function listenDataCloud(tanggal) {
            const masterRef = ref(db, 'master_generus');
            onValue(masterRef, (masterSnap) => {
                const masterData = masterSnap.val() || {};
                
                const absensiRef = ref(db, 'absensi/' + tanggal);
                onValue(absensiRef, (absensiSnap) => {
                    const absensiData = absensiSnap.val() || {};
                    
                    window.daftarGenerus = Object.values(masterData).map((item) => {
                        const statusHariIni = absensiData[item.id] || {};
                        return {
                            id: item.id,
                            nama: item.nama,
                            kategori: item.kategori || "ACR",
                            status: statusHariIni.status || "",
                            waktu: statusHariIni.waktu || "",
                            catatan: statusHariIni.catatan || ""
                        };
                    });

                    window.tampilkanGenerus();
                });
            });

            const materiRef = ref(db, 'materi/' + tanggal);
            onValue(materiRef, (materiSnap) => {
                document.getElementById("inputMateri").value = materiSnap.val() || "";
            });
        }

        // 4. Simpan Materi
        window.simpanMateriCloud = function() {
            const materi = document.getElementById("inputMateri").value;
            set(ref(db, 'materi/' + window.tanggalAktif), materi);
        };

        // 5. Render Tabel
        window.tampilkanGenerus = function() {
            const tbody = document.getElementById("tabelGenerus");
            const filterKat = document.getElementById("filterKategori").value;
            tbody.innerHTML = "";

            let nomor = 1;
            window.daftarGenerus.forEach((generus) => {
                if (filterKat !== "Semua" && generus.kategori !== filterKat) return;

                const tombolHapus = window.isAdmin 
                    ? `<button onclick="hapusGenerus('${generus.id}')" class="ml-1 text-red-400 hover:text-red-600 font-bold px-1.5 py-0.5 text-xs rounded hover:bg-red-50 transition" title="Hapus Data">✕</button>` 
                    : '';

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="p-3.5 text-center font-semibold text-slate-400 text-xs">${nomor++}</td>
                        <td class="p-3.5">
                            <div class="font-semibold text-slate-800">${generus.nama}</div>
                            <span class="inline-block bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded-full border border-slate-200 mt-1">${generus.kategori}</span>
                        </td>
                        <td class="p-3.5 text-center">
                            <div class="no-print flex flex-col items-center gap-1">
                                <div class="flex justify-center gap-1">
                                    <button onclick="pilihStatus('${generus.id}', 'Hadir')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition ${generus.status === 'Hadir' ? 'bg-emerald-600 text-white shadow-sm ring-2 ring-emerald-300' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200'}">Hadir</button>
                                    <button onclick="pilihStatus('${generus.id}', 'Izin')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition ${generus.status === 'Izin' ? 'bg-amber-500 text-white shadow-sm ring-2 ring-amber-300' : 'bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200'}">Izin</button>
                                    <button onclick="pilihStatus('${generus.id}', 'Sakit')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition ${generus.status === 'Sakit' ? 'bg-blue-600 text-white shadow-sm ring-2 ring-blue-300' : 'bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200'}">Sakit</button>
                                    <button onclick="pilihStatus('${generus.id}', 'Alpa')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition ${generus.status === 'Alpa' ? 'bg-red-600 text-white shadow-sm ring-2 ring-red-300' : 'bg-red-50 text-red-700 hover:bg-red-100 border border-red-200'}">Alpa</button>
                                    ${tombolHapus}
                                </div>
                                ${generus.waktu ? `<span class="text-[10px] font-medium text-slate-400 mt-0.5">🕒 ${generus.waktu}</span>` : ''}
                            </div>
                            <div class="hidden print:block font-bold ${getStatusColor(generus.status)}">
                                ${generus.status || 'Belum Absen'} ${generus.waktu ? `(${generus.waktu})` : ''}
                            </div>
                        </td>
                        <td class="p-3.5">
                            <input type="text" value="${generus.catatan || ''}" onchange="updateCatatan('${generus.id}', this.value)" placeholder="Tambah catatan..." class="w-full border border-slate-200 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-emerald-500 bg-slate-50/50 focus:bg-white transition">
                        </td>
                    </tr>
                `;
            });

            updateRekap();
        };

        function getStatusColor(status) {
            if (status === 'Hadir') return 'text-emerald-600';
            if (status === 'Izin') return 'text-amber-600';
            if (status === 'Sakit') return 'text-blue-600';
            if (status === 'Alpa') return 'text-red-600';
            return 'text-slate-400';
        }

        function updateRekap() {
            document.getElementById("jumlahHadir").innerText = window.daftarGenerus.filter(g => g.status === 'Hadir').length;
            document.getElementById("jumlahIzin").innerText = window.daftarGenerus.filter(g => g.status === 'Izin').length;
            document.getElementById("jumlahSakit").innerText = window.daftarGenerus.filter(g => g.status === 'Sakit').length;
            document.getElementById("jumlahAlpa").innerText = window.daftarGenerus.filter(g => g.status === 'Alpa').length;
        }

        // 6. Pilih Status Kehadiran
        window.pilihStatus = function(id, statusPilihan) {
            const generus = window.daftarGenerus.find(g => g.id === id);
            if(!generus) return;

            const now = new Date();
            const jam = String(now.getHours()).padStart(2, '0');
            const menit = String(now.getMinutes()).padStart(2, '0');
            const waktuFormat = `${jam}:${menit} WIB`;

            set(ref(db, `absensi/${window.tanggalAktif}/${id}`), {
                id: generus.id,
                nama: generus.nama,
                kategori: generus.kategori,
                status: statusPilihan,
                waktu: waktuFormat,
                catatan: generus.catatan || ""
            });
        };

        // 7. Update Catatan
        window.updateCatatan = function(id, teks) {
            const generus = window.daftarGenerus.find(g => g.id === id);
            if(!generus) return;

            set(ref(db, `absensi/${window.tanggalAktif}/${id}`), {
                id: generus.id,
                nama: generus.nama,
                kategori: generus.kategori,
                status: generus.status || "",
                waktu: generus.waktu || "",
                catatan: teks
            });
        };

        // 8. Tambah Generus Baru
        window.tambahGenerus = function() {
            const inputNama = document.getElementById("inputNama");
            const inputKat = document.getElementById("inputKategori");
            const nama = inputNama.value.trim();

            if (nama === "") {
                alert("Silakan masukkan nama Generus!");
                return;
            }

            const idBaru = 'gen_' + Date.now();
            set(ref(db, `master_generus/${idBaru}`), { id: idBaru, nama: nama, kategori: inputKat.value });
            inputNama.value = "";
        };

        // 9. Import File CSV
        window.importCSV = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const baris = e.target.result.split("\n");
                let jumlah = 0;

                baris.forEach((line, idx) => {
                    if (idx === 0 || line.trim() === "") return;
                    const kolom = line.split(",");
                    if (kolom.length >= 1) {
                        const nama = kolom[0].replace(/"/g, '').trim();
                        const kategori = kolom[1] ? kolom[1].replace(/"/g, '').trim().toUpperCase() : "ACR";

                        if (nama !== "") {
                            const idBaru = 'gen_' + (Date.now() + idx);
                            set(ref(db, `master_generus/${idBaru}`), { id: idBaru, nama: nama, kategori: kategori });
                            jumlah++;
                        }
                    }
                });
                alert(`Berhasil mengimpor ${jumlah} generus ke Database Cloud!`);
            };
            reader.readAsText(file);
        };

        // 10. Reset Absensi Hari Ini
        window.resetAbsensiHariIni = function() {
            if (confirm(`🔄 PERINGATAN!\n\nYakin ingin mengosongkan status absensi untuk tanggal (${window.tanggalAktif})?`)) {
                remove(ref(db, `absensi/${window.tanggalAktif}`));
                alert(`Status absensi tanggal ${window.tanggalAktif} dibersihkan!`);
            }
        };

        // 11. Hapus & Reset Database
        window.hapusGenerus = function(id) {
            if (confirm("⚠️ Yakin ingin menghapus nama ini?")) {
                remove(ref(db, `master_generus/${id}`));
                remove(ref(db, `absensi/${window.tanggalAktif}/${id}`));
            }
        };

        window.resetSemuaData = function() {
            if (confirm("⚠️ PERINGATAN CRITICAL!\n\nYakin ingin menghapus SELURUH database?")) {
                remove(ref(db, '/'));
                location.reload();
            }
        };

        // 12. Cetak & Export Harian
        window.cetakLaporan = function() { window.print(); };

        window.exportExcelHarian = function() {
            const materi = document.getElementById("inputMateri").value || "-";
            const filterKat = document.getElementById("filterKategori").value;
            let csvContent = `data:text/csv;charset=utf-8,Laporan Absensi Ngaji Generus (Harian)\nTanggal: ${window.tanggalAktif}\nKategori: ${filterKat}\nMateri Ngaji: "${materi}"\n\nNo,Nama,Kategori,Status,Waktu,Catatan / Keterangan\n`;

            let no = 1;
            window.daftarGenerus.forEach((generus) => {
                if (filterKat !== "Semua" && generus.kategori !== filterKat) return;

                let st = generus.status || "Belum Absen";
                let wk = generus.waktu || "-";
                let ct = generus.catatan ? generus.catatan.replace(/"/g, '""') : "-";
                csvContent += `${no++},"${generus.nama}",${generus.kategori},${st},${wk},"${ct}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Absensi_Generus_${window.tanggalAktif}_${filterKat}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // Helper Kode Status
        function getKodeAbsen(status) {
            if (status === 'Hadir') return 'H';
            if (status === 'Izin') return 'I';
            if (status === 'Sakit') return 'S';
            if (status === 'Alpa') return 'A';
            return '';
        }

        // Helper Style Excel
        const thinBorder = {
            top: { style: 'thin', color: { rgb: "CCCCCC" } },
            bottom: { style: 'thin', color: { rgb: "CCCCCC" } },
            left: { style: 'thin', color: { rgb: "CCCCCC" } },
            right: { style: 'thin', color: { rgb: "CCCCCC" } }
        };

        function beriGarisDanFormatTabel(sheet) {
            const range = XLSX.utils.decode_range(sheet['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cell_address = { c: C, r: R };
                    const cell_ref = XLSX.utils.encode_cell(cell_address);
                    if (!sheet[cell_ref]) sheet[cell_ref] = { t: 's', v: '' };

                    sheet[cell_ref].s = sheet[cell_ref].s || {};
                    sheet[cell_ref].s.border = thinBorder;

                    if (R < 2) {
                        sheet[cell_ref].s.fill = { fgColor: { rgb: "198754" } };
                        sheet[cell_ref].s.font = { name: "Calibri", bold: true, color: { rgb: "FFFFFF" } };
                        sheet[cell_ref].s.alignment = { horizontal: "center", vertical: "center" };
                    } else {
                        sheet[cell_ref].s.font = { name: "Calibri", size: 11 };
                        if (C === 0 || C >= 3) {
                            sheet[cell_ref].s.alignment = { horizontal: "center", vertical: "center" };
                        } else {
                            sheet[cell_ref].s.alignment = { horizontal: "left", vertical: "center" };
                        }

                        // Format persen untuk kolom presentase
                        if (sheet[cell_ref].f && sheet[cell_ref].f.includes("/")) {
                            sheet[cell_ref].z = "0.0%";
                        }

                        const val = String(sheet[cell_ref].v || "");
                        if (val.includes("Total")) {
                            sheet[cell_ref].s.fill = { fgColor: { rgb: "E2E3E5" } };
                            sheet[cell_ref].s.font = { name: "Calibri", bold: true };
                        }
                    }
                }
            }
        }

        // 13. Download Rekap Multi-Sheet Excel dengan Murni Hadir saja untuk Presentase
        window.downloadRekapMultiSheetExcel = async function() {
            alert("Memproses data 3 Sheet Excel... Mohon tunggu sebentar.");

            const snapshotMaster = await get(ref(db, 'master_generus'));
            const masterData = snapshotMaster.val() || {};
            const listGenerus = Object.values(masterData);

            if (listGenerus.length === 0) {
                alert("Data master generus masih kosong!");
                return;
            }

            const snapshotAbsensi = await get(ref(db, 'absensi'));
            const allAbsensi = snapshotAbsensi.val() || {};
            const sortedDates = Object.keys(allAbsensi).sort();

            const wb = XLSX.utils.book_new();

            // Maksimal 6 tanggal pengajian per periode (Kolom D s.d I)
            const dateHeaders = sortedDates.slice(0, 6);

            // ==========================================
            // SHEET 1: Absensi APR - GPN PIU
            // ==========================================
            const ws1Data = [];
            const r1 = ["Absensi APR - GPN PIU", "", "", "Tanggal Hadir"];
            r1[9] = "Akumulasi Kehadiran";
            r1[10] = "Jumlah Pertemuan";
            r1[11] = "Presentase";
            ws1Data.push(r1);

            const r2 = ["No", "Nama Lengkap", "Kategori"];
            dateHeaders.forEach((d, idx) => { r2[3 + idx] = d; });
            ws1Data.push(r2);

            let currentRowIdx = 3;
            const katPIU = ["APR", "AR", "GPN-A", "GPN-B"];

            katPIU.forEach(kat => {
                const anggota = listGenerus.filter(g => (g.kategori || "ACR") === kat);
                if (anggota.length > 0) {
                    let no = 1;
                    let startCatRow = currentRowIdx;

                    anggota.forEach(g => {
                        let row = [no++, g.nama, kat];

                        dateHeaders.forEach((d, dIdx) => {
                            const abs = allAbsensi[d] && allAbsensi[d][g.id];
                            row[3 + dIdx] = abs ? getKodeAbsen(abs.status) : "";
                        });

                        // RUMUS HANYA MENGHITUNG "H" (HADIR)
                        row[9] = { f: `COUNTIF(D${currentRowIdx}:I${currentRowIdx}, "H")` };
                        row[10] = dateHeaders.length;
                        row[11] = { f: `J${currentRowIdx}/K${currentRowIdx}` };

                        ws1Data.push(row);
                        currentRowIdx++;
                    });

                    let endCatRow = currentRowIdx - 1;
                    let totalRow = ["Total", "", ""];
                    totalRow[9] = { f: `SUM(J${startCatRow}:J${endCatRow})` };
                    totalRow[10] = { f: `SUM(K${startCatRow}:K${endCatRow})` };
                    totalRow[11] = { f: `AVERAGE(L${startCatRow}:L${endCatRow})` };

                    ws1Data.push(totalRow);
                    currentRowIdx++;
                    ws1Data.push([]); // Spacer
                    currentRowIdx++;
                }
            });

            const ws1 = XLSX.utils.aoa_to_sheet(ws1Data);
            beriGarisDanFormatTabel(ws1);
            XLSX.utils.book_append_sheet(wb, ws1, "Absensi APR - GPN PIU");

            // ==========================================
            // SHEET 2: Absensi AR Intensif
            // ==========================================
            const ws2Data = [];
            const r2_1 = ["Absensi AR Intensif", "", "", "Tanggal Hadir"];
            r2_1[9] = "Akumulasi Kehadiran";
            r2_1[10] = "Jumlah Pertemuan";
            r2_1[11] = "Presentase";
            ws2Data.push(r2_1);

            const r2_2 = ["No", "Nama Lengkap", "Kategori"];
            dateHeaders.forEach((d, idx) => { r2_2[3 + idx] = d; });
            ws2Data.push(r2_2);

            let rowIdx2 = 3;
            const anggotaAR = listGenerus.filter(g => g.kategori === "AR Intensif" || g.kategori === "AR");
            let startARRow = rowIdx2;
            let noAR = 1;

            anggotaAR.forEach(g => {
                let row = [noAR++, g.nama, "AR Intensif"];

                dateHeaders.forEach((d, dIdx) => {
                    const abs = allAbsensi[d] && allAbsensi[d][g.id];
                    row[3 + dIdx] = abs ? getKodeAbsen(abs.status) : "";
                });

                row[9] = { f: `COUNTIF(D${rowIdx2}:I${rowIdx2}, "H")` };
                row[10] = dateHeaders.length;
                row[11] = { f: `J${rowIdx2}/K${rowIdx2}` };

                ws2Data.push(row);
                rowIdx2++;
            });

            let endARRow = rowIdx2 - 1;
            let totalRowAR = ["Total Akumulasi Hadir & Presentase", "", ""];
            totalRowAR[9] = { f: `SUM(J${startARRow}:J${endARRow})` };
            totalRowAR[10] = { f: `SUM(K${startARRow}:K${endARRow})` };
            totalRowAR[11] = { f: `AVERAGE(L${startARRow}:L${endARRow})` };
            ws2Data.push(totalRowAR);

            const ws2 = XLSX.utils.aoa_to_sheet(ws2Data);
            beriGarisDanFormatTabel(ws2);
            XLSX.utils.book_append_sheet(wb, ws2, "Absensi AR Intensif");

            // ==========================================
            // SHEET 3: Absensi ACR (Range C s.d J)
            // ==========================================
            const ws3Data = [];
            const r3_1 = ["No", "Nama Lengkap", "Tanggal "];
            r3_1[10] = "Akumulasi Hadir";
            r3_1[11] = "Jumlah Pertemuan";
            r3_1[12] = "Presentase";
            ws3Data.push(r3_1);

            const r3_2 = ["", ""];
            dateHeaders.forEach((d, idx) => { r3_2[2 + idx] = d; });
            ws3Data.push(r3_2);

            let rowIdx3 = 3;
            const anggotaACR = listGenerus.filter(g => (g.kategori || "ACR") === "ACR");
            let startACRRow = rowIdx3;
            let noACR = 1;

            anggotaACR.forEach(g => {
                let row = [noACR++, g.nama];

                dateHeaders.forEach((d, dIdx) => {
                    const abs = allAbsensi[d] && allAbsensi[d][g.id];
                    row[2 + dIdx] = abs ? getKodeAbsen(abs.status) : "";
                });

                // Rumus COUNTIF khusus Sheet ACR (Kolom C s.d J)
                row[10] = { f: `COUNTIF(C${rowIdx3}:J${rowIdx3}, "H")` };
                row[11] = dateHeaders.length;
                row[12] = { f: `K${rowIdx3}/L${rowIdx3}` };

                ws3Data.push(row);
                rowIdx3++;
            });

            let endACRRow = rowIdx3 - 1;
            let totalRowACR = ["Total Akumulasi Hadir & Presentase", ""];
            totalRowACR[10] = { f: `SUM(K${startACRRow}:K${endACRRow})` };
            totalRowACR[11] = { f: `SUM(L${startACRRow}:L${endACRRow})` };
            totalRowACR[12] = { f: `AVERAGE(M${startACRRow}:M${endACRRow})` };
            ws3Data.push(totalRowACR);

            const ws3 = XLSX.utils.aoa_to_sheet(ws3Data);
            beriGarisDanFormatTabel(ws3);
            XLSX.utils.book_append_sheet(wb, ws3, "Absensi ACR");

            // Unduh file .xlsx resmi
            XLSX.writeFile(wb, `Rekap_Absensi_Generus_PIU.xlsx`);
        };

        // Start Application
        initTanggal();
    </script>
