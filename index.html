<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Absensi Generus PIU</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 relative overflow-x-hidden">

    <div id="sidebarBackdrop" onclick="tutupSidebar()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden transition-opacity duration-300 opacity-0"></div>

    <aside id="sidebarMenu" class="fixed top-0 left-0 bottom-0 w-72 bg-white z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-2xl flex flex-col justify-between border-r border-slate-200">
        <div>
            <div class="p-4 bg-gradient-to-r from-emerald-800 to-teal-700 text-white flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🕌</span>
                    <div>
                        <h2 class="font-bold text-sm leading-tight">Generus PIU</h2>
                        <p class="text-[10px] text-emerald-200">Majelis Ta'lim & Pengajian</p>
                    </div>
                </div>
                <button onclick="tutupSidebar()" class="p-1 rounded-lg hover:bg-white/10 text-white transition text-lg">✕</button>
            </div>
            <nav class="p-3 space-y-1 text-xs font-semibold overflow-y-auto max-h-[calc(100vh-140px)]">
                <p class="px-3 py-1.5 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Dashboard & Absensi</p>
                <button onclick="pindahTab('dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-700 hover:bg-emerald-50 hover:text-emerald-800 transition text-left">📊 Dashboard Analytics</button>
                
                <div>
                    <button onclick="toggleDropdownAbsen()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-emerald-800 bg-emerald-50 hover:bg-emerald-100 transition font-bold text-left">
                        <div class="flex items-center gap-3">📋 <span>Input Absen</span></div>
                        <span id="ikonPanahDropdown" class="transition-transform duration-200 text-xs">▼</span>
                    </button>
                    <div id="dropdownSubMenu" class="hidden pl-4 pr-1 py-1.5 space-y-1 border-l-2 border-emerald-500 ml-3 my-1">
                        <button onclick="bukaModalAbsen('RemajaKelompok')" class="w-full px-3 py-2 rounded-lg text-slate-700 hover:bg-emerald-50 text-left font-medium">🕌 Absen Remaja Kelompok</button>
                        <button onclick="bukaModalAbsen('ACR')" class="w-full px-3 py-2 rounded-lg text-slate-700 hover:bg-emerald-50 text-left font-medium">👶 Absen ACR</button>
                        <button onclick="bukaModalAbsen('ARIntensif')" class="w-full px-3 py-2 rounded-lg text-slate-700 hover:bg-emerald-50 text-left font-medium">📖 Absen AR Intensif</button>
                    </div>
                </div>
                <button onclick="bukaModalAbsen('Desa')" class="w-full px-3 py-2.5 rounded-xl text-teal-800 hover:bg-teal-50 text-left">🏡 Pengajian Desa</button>
                <button onclick="bukaModalAbsen('Daerah')" class="w-full px-3 py-2.5 rounded-xl text-teal-800 hover:bg-teal-50 text-left">🏛️ Pengajian Daerah</button>
                <button onclick="pindahTab('riwayat')" class="w-full px-3 py-2.5 rounded-xl text-slate-700 hover:bg-emerald-50 text-left">📜 Cek Riwayat Ngaji</button>
                <hr class="my-2 border-slate-100">
                <button onclick="bukaModalPin('ADMIN')" class="w-full px-3 py-2.5 rounded-xl text-slate-700 hover:bg-emerald-50 text-left">⚙️ Admin</button>
                <button onclick="bukaModalPin('SUPERADMIN')" class="w-full px-3 py-2.5 rounded-xl text-amber-800 bg-amber-50 text-left font-bold">👑 Superadmin</button>
            </nav>
        </div>
    </aside>

    <div class="max-w-md sm:max-w-4xl mx-auto p-2 sm:p-6 space-y-6">
        <div class="bg-gradient-to-r from-emerald-800 via-teal-700 to-emerald-900 rounded-2xl p-3.5 sm:p-5 text-white shadow-lg flex justify-between items-center">
            <button onclick="bukaSidebar()" class="p-2 rounded-xl bg-white/10 text-white">☰</button>
            <h1 class="text-base sm:text-2xl font-black">ABSENSI GENERUS PIU</h1>
            <button onclick="toggleDropdownAbsen()" class="bg-emerald-500 px-3.5 py-2 rounded-xl text-xs font-extrabold">📋 Isi Absen</button>
        </div>

        <div id="sectionDashboard" class="space-y-4 pt-2">
            <!-- Grid Statistik tetap sama -->
        </div>

        <div id="sectionRiwayat" class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6 space-y-4">
            <div class="flex justify-between border-b pb-3">
                <h3 class="font-black text-sm sm:text-base">📜 CEK RIWAYAT NGAJI (RENTANG TANGGAL)</h3>
                <button onclick="pindahTab('dashboard')" class="bg-slate-100 text-xs font-bold px-3 py-1.5 rounded-lg">⬅️ Kembali</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                <input type="date" id="inputStartRiwayat" class="sm:col-span-3 border rounded-xl p-2.5 text-xs">
                <input type="date" id="inputEndRiwayat" class="sm:col-span-3 border rounded-xl p-2.5 text-xs">
                <select id="pilihanJenisRiwayat" class="sm:col-span-3 border rounded-xl p-2.5 text-xs">
                    <option value="Kelompok">Pengajian Kelompok</option>
                    <option value="ARIntensif">Pengajian AR Intensif</option>
                    <option value="Desa">Pengajian Desa</option>
                    <option value="Daerah">Pengajian Daerah</option>
                </select>
                <select id="pilihanSesiRiwayat" class="sm:col-span-2 border rounded-xl p-2.5 text-xs">
                    <option value="Malam">🌙 Malam</option>
                    <option value="Sore">☀️ Sore</option>
                </select>
                <button onclick="tampilkanRiwayatAbsen()" class="sm:col-span-1 bg-teal-700 text-white font-bold rounded-xl text-xs">🔍 Cek</button>
            </div>
            <div id="boxHasilRiwayat" class="overflow-x-auto mt-3">
                <table class="w-full text-left border-collapse text-xs">
                    <thead><tr class="bg-slate-100 uppercase text-slate-700 font-bold"><th class="p-3">No</th><th class="p-3">Tgl & Sesi</th><th class="p-3">Nama</th><th class="p-3">Status</th><th class="p-3">Materi</th></tr></thead>
                    <tbody id="tabelRiwayatAbsenDesktop"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modals (Tetap sama) -->
    <div id="modalAbsenHarian" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4"></div>
    <div id="modalPinAdmin" class="fixed inset-0 bg-slate-900/60 z-50 hidden flex items-center justify-center p-4"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        
        // ... (konfigurasi Firebase sama)
        const firebaseConfig = { apiKey: "AIzaSyDZLPT-hDqspOX4HIauNlw4ZpoMwR3zwls", authDomain: "absensi-generus-db.firebaseapp.com", projectId: "absensi-generus-db", storageBucket: "absensi-generus-db.firebasestorage.app", messagingSenderId: "350847945290", appId: "1:350847945290:web:c9737eebb3e8092db4f4b3", databaseURL: "https://absensi-generus-db-default-rtdb.asia-southeast1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let dataMasterGenerus = [];
        window.tampilkanRiwayatAbsen = async function() {
            let rawStart = document.getElementById("inputStartRiwayat").value;
            let rawEnd = document.getElementById("inputEndRiwayat").value;
            const jenisDipilih = document.getElementById("pilihanJenisRiwayat").value;
            const sesi = document.getElementById("pilihanSesiRiwayat").value;
            const tbodyDesktop = document.getElementById("tabelRiwayatAbsenDesktop");
            tbodyDesktop.innerHTML = "";

            if (!rawStart || !rawEnd) { alert("Pilih tanggal!"); return; }
            
            // Debugging
            console.log("Input Tanggal:", rawStart, rawEnd);
            
            const snapAllAbsen = await get(ref(db, 'absensi'));
            const allAbsenData = snapAllAbsen.val() || {};
            
            console.log("Database Keys:", Object.keys(allAbsenData));

            let matchedKeys = Object.keys(allAbsenData).filter(k => {
                let tgl = k.substring(0, 10);
                return tgl >= rawStart && tgl <= rawEnd && k.includes(jenisDipilih) && k.includes(sesi);
            }).sort();

            console.log("Data yang cocok:", matchedKeys);

            if (matchedKeys.length === 0) {
                tbodyDesktop.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-500">Tidak ada data untuk rentang ini. Cek Console F12.</td></tr>`;
                return;
            }
            
            // ... (tampilkan data ke tabel)
        };
    </script>
</body>
</html>
